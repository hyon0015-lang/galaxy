let VG=null;function vig(){VG=document.createElement('canvas');VG.width=W;VG.height=H;const v=VG.getContext('2d'),q=v.createRadialGradient(W/2,H*.5,H*.45,W/2,H*.5,Math.hypot(W,H)*.52);q.addColorStop(0,'rgba(30,22,44,0)');q.addColorStop(1,'rgba(30,22,44,.34)');v.fillStyle=q;v.fillRect(0,0,W,H)}

let hands=null,busy=0,lost=0;const BLOBS={};
let GD=0,GDONE=0;function drawCore(ox,c,px,py,fo,al){const sx=v=>Math.round(v/c)*c,cx=sx(px),cy=sx(py),k=1-fo,rr=(2+fo*4)*c,col=k>.5?'#ffd98a':'#bfe6ff',n=8;ox.globalAlpha=al;ox.fillStyle=col;for(let i=0;i<n;i++){const t=i/n*6.283+ROT;ox.fillRect(sx(cx+Math.cos(t)*rr),sx(cy+Math.sin(t)*rr),c,c)}ox.fillStyle='#fff';ox.fillRect(cx,cy,c,c);ox.fillStyle=k>.5?'#ffb84a':'#ff9ac8';[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>ox.fillRect(cx+a*c,cy+b*c,c,c));ox.globalAlpha=1}
